name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "opencv/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "opencv/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Cache OpenCV Android SDK
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: opencv/
          key: opencv-android-sdk-5.0.0-${{ runner.os }}

      - name: Download OpenCV Android SDK 5.0.0
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          OPENCV_VERSION="5.0.0"
          ZIP="$RUNNER_TEMP/opencv-android-sdk.zip"
          ROOT="$RUNNER_TEMP/opencv-sdk"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip" \
            -o "$ZIP"
          rm -rf "$ROOT" opencv
          mkdir -p "$ROOT" opencv
          unzip -q "$ZIP" -d "$ROOT"
          SDK_DIR="$(find "$ROOT" -type d -path '*/sdk' -print -quit)"
          test -n "$SDK_DIR"
          test -d "$SDK_DIR/java"
          cp -R "$SDK_DIR/." opencv/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: false

      - name: Decode Keystore
        id: keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: dev_keystore.jks
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Validate offline privacy guardrails
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="app/src/main/AndroidManifest.xml"
          if grep -Eq 'android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"; then
            echo "Network permission found in app manifest; core ImageForge must remain offline." >&2
            exit 1
          fi
          if grep -R -nE 'OkHttpClient|Retrofit|HttpURLConnection|java\\.net\\.http|URLConnection' app/src core/*/src/main feature/*/src/main --include='*.kt' --include='*.java' 2>/dev/null; then
            echo "Potential network client/API usage found in core/application source." >&2
            exit 1
          fi
          echo "Offline/privacy guardrails passed."

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:lintRelease --no-daemon --build-cache --stacktrace
          else
            gradle :app:lintRelease --no-daemon --build-cache --stacktrace
          fi

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :core:common:test :core:imageprocessor:test :core:media:test :core:storage:test :core:ocr:test :core:vision-opencv:test :core:ml:test --no-daemon --build-cache --stacktrace
          else
            gradle :core:common:test :core:imageprocessor:test :core:ocr:test --no-daemon --build-cache --stacktrace
          fi

      - name: Build release APK
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :core:ocr:assembleRelease :core:vision-opencv:assembleRelease :core:ml:assembleRelease :app:assembleRelease --no-daemon --build-cache --stacktrace
          else
            gradle :core:ocr:assembleRelease :app:assembleRelease --no-daemon --build-cache --stacktrace
          fi

      - name: Measure release APKs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          REPORT="build/image-forge-phase18-apk-size.txt"
          mkdir -p build
          {
            echo "ImageForge Phase 18 APK size report"
            echo "Commit: $GITHUB_SHA"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            find "$APK_DIR" -maxdepth 1 -type f -name "app-*-release.apk" -printf "%f %s bytes\\n" | sort
            echo
            echo "Total bytes:"
            find "$APK_DIR" -maxdepth 1 -type f -name "app-*-release.apk" -printf "%s\\n" | awk '{sum += $1} END {print sum}'
          } | tee "$REPORT"

      - name: Verify split APKs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "app-*-release.apk" -print | sort)
          test "${#APKS[@]}" -eq 4
          printf "%s\n" "${APKS[@]}"
          ls -lh "${APKS[@]}"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for APK in "${APKS[@]}"; do
            "$APKSIGNER" verify --verbose "$APK"
          done

      - name: Release smoke validation
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          EXPECTED_PACKAGE="org.techwithkaushik.imageforge"
          EXPECTED_VERSION_CODE="1"
          EXPECTED_VERSION_NAME="0.1.0"
          declare -A EXPECTED_ABIS=(
            [app-arm64-v8a-release.apk]="arm64-v8a"
            [app-armeabi-v7a-release.apk]="armeabi-v7a"
            [app-x86_64-release.apk]="x86_64"
            [app-x86-release.apk]="x86"
          )
          for APK in "$APK_DIR"/app-*-release.apk; do
            NAME="$(basename "$APK")"
            test -n "${EXPECTED_ABIS[$NAME]:-}"
            BADGING="$("$AAPT2" dump badging "$APK")"
            grep -Fq "package: name='$EXPECTED_PACKAGE' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" <<<"$BADGING"
            grep -Fq "native-code: '${EXPECTED_ABIS[$NAME]}'" <<<"$BADGING"
            "$APKSIGNER" verify --verbose "$APK"
          done
          echo "Release smoke validation passed for all architecture APKs."

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: image-forge-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          archive: false

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: image-forge-armeabi-v7a
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          archive: false

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: image-forge-x86_64
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
          archive: false

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: image-forge-x86
          path: app/build/outputs/apk/release/app-x86-release.apk
          if-no-files-found: error
          archive: false

      - name: Upload Phase 18 APK size report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-forge-phase18-apk-size-report
          path: build/image-forge-phase18-apk-size.txt
          if-no-files-found: error
          archive: false
