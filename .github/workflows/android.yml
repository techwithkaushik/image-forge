name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "opencv/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "core/**"
      - "feature/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "opencv/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Cache OpenCV Android SDK
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: opencv/
          key: opencv-android-sdk-5.0.0-${{ runner.os }}

      - name: Download OpenCV Android SDK 5.0.0
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          OPENCV_VERSION="5.0.0"
          ZIP="$RUNNER_TEMP/opencv-android-sdk.zip"
          ROOT="$RUNNER_TEMP/opencv-sdk"
          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/opencv/opencv/releases/download/${OPENCV_VERSION}/opencv-${OPENCV_VERSION}-android-sdk.zip" \
            -o "$ZIP"
          rm -rf "$ROOT" opencv
          mkdir -p "$ROOT" opencv
          unzip -q "$ZIP" -d "$ROOT"
          SDK_DIR="$(find "$ROOT" -type d -path '*/sdk' -print -quit)"
          test -n "$SDK_DIR"
          test -d "$SDK_DIR/java"
          cp -R "$SDK_DIR/." opencv/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: enhanced
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          validate-wrappers: false

      - name: Decode Keystore
        id: keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: timheuer/base64-to-file@v2.0
        with:
          fileName: dev_keystore.jks
          encodedString: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :core:common:test :core:imageprocessor:test :core:media:test :core:storage:test :core:ocr:test --no-daemon --build-cache --stacktrace
          else
            gradle :core:common:test :core:imageprocessor:test :core:ocr:test --no-daemon --build-cache --stacktrace
          fi

      - name: Build release APK
        env:
          SIGN_KEY_STORE: ${{ steps.keystore.outputs.filePath }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :core:ocr:assembleRelease :app:assembleRelease --no-daemon --build-cache --stacktrace
          else
            gradle :core:ocr:assembleRelease :app:assembleRelease --no-daemon --build-cache --stacktrace
          fi

      - name: Verify split APKs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name "app-*-release.apk" -print | sort)
          test "${#APKS[@]}" -eq 4
          printf "%s\n" "${APKS[@]}"
          ls -lh "${APKS[@]}"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for APK in "${APKS[@]}"; do
            "$APKSIGNER" verify --verbose "$APK"
          done

      - name: Upload arm64-v8a APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-forge-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          archive: false

      - name: Upload armeabi-v7a APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-forge-armeabi-v7a
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          archive: false

      - name: Upload x86_64 APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-forge-x86_64
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
          archive: false

      - name: Upload x86 APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-forge-x86
          path: app/build/outputs/apk/release/app-x86-release.apk
          if-no-files-found: error
          archive: false
